name: Capture real application screenshots

on:
  push:
    branches: [feature/english-localization]
    paths:
      - "platforms/**"
      - "l10n/**"
      - ".github/workflows/capture-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qrex-screenshots
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: python3 tool/generate_localizations.py --check
      - name: Build Android debug app
        working-directory: platforms/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Capture screen using real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            adb install platforms/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.brendigo.qrex/.MainActivity --es qrex_screenshot create
            sleep 10
            adb shell screencap -p /sdcard/qrex.png
            mkdir -p docs/screenshots
            adb pull /sdcard/qrex.png docs/screenshots/android-create.png
            test -s docs/screenshots/android-create.png
      - uses: actions/upload-artifact@v4
        with:
          name: qrex-actual-android
          path: docs/screenshots/android-create.png
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate QREX AppIcon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from tool.prepare_platforms import render_png
          p = Path("platforms/ios/QREX/Assets.xcassets/AppIcon.appiconset")
          p.mkdir(parents=True, exist_ok=True)
          render_png(p / "AppIcon.png", 1024)
          (p / "Contents.json").write_text(json.dumps({
            "images": [{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],
            "info":{"author":"xcode","version":1}
          }), encoding="utf-8")
          PY
      - run: python3 tool/generate_localizations.py --check
      - name: Generate Xcode project
        working-directory: platforms/ios
        run: xcodegen generate --spec project.yml
      - name: Build iOS simulator app
        working-directory: platforms/ios
        run: |
          xcodebuild -project QREX.xcodeproj -scheme QREX -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Screenshot from booted iPhone simulator
        run: |
          DEVICE=$(python3 - <<'PY'
          import json,subprocess
          devices=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"]))["devices"]
          iphones=[item["udid"] for entries in devices.values() for item in entries
                   if item.get("isAvailable") and "iPhone" in item.get("name","")]
          if not iphones:
              raise SystemExit("No iPhone simulator is installed; cannot produce a genuine screenshot.")
          print(iphones[0])
          PY
          )
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" platforms/ios/build/Build/Products/Release-iphonesimulator/QREX.app
          xcrun simctl launch "$DEVICE" com.brendigo.qrex -qrex-screenshot-create
          sleep 9
          mkdir -p docs/screenshots
          xcrun simctl io "$DEVICE" screenshot docs/screenshots/ios-create.png
          test -s docs/screenshots/ios-create.png
      - uses: actions/upload-artifact@v4
        with:
          name: qrex-actual-ios
          path: docs/screenshots/ios-create.png
          if-no-files-found: error

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-localization
      - uses: actions/download-artifact@v4
        with:
          pattern: qrex-actual-*
          path: docs/screenshots
          merge-multiple: true
      - name: Validate authentic PNG captures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for n in ("android-create.png","ios-create.png"):
              p=Path("docs/screenshots")/n
              with p.open("rb") as f:
                  assert f.read(8)==b"\x89PNG\r\n\x1a\n", f"Invalid screenshot: {p}"
              assert p.stat().st_size>20000
          print("Verified real emulator and simulator PNG screenshots.")
          PY
      - name: Commit screenshots to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/android-create.png docs/screenshots/ios-create.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: add actual Android and iOS simulator screenshots [skip ci]"
            git push origin HEAD:feature/english-localization
          fi
