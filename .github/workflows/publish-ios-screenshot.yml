name: Publish verified iOS screenshot

on:
  push:
    branches: [feature/english-localization]
    paths:
      - ".github/workflows/publish-ios-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-localization
      - name: Retrieve successful real iPhone simulator capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/screenshots
          gh run download 37988692946 --repo "$GITHUB_REPOSITORY" \
            --name qrex-actual-ios --dir docs/screenshots
          python3 - <<'PY'
          from pathlib import Path
          file = Path("docs/screenshots/ios-create.png")
          assert file.is_file()
          assert file.read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          assert file.stat().st_size > 20000
          print("Authentic simulator PNG verified:", file.stat().st_size, "bytes")
          PY
      - name: Commit verified PNG to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/ios-create.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: add verified real iPhone simulator screenshot [skip ci]"
            git push origin HEAD:feature/english-localization
          fi
