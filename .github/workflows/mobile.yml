name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Flutter check and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS project hosts
        run: flutter create --platforms=android,ios --org com.brendigo --project-name qrex .
      - name: Apply QREX native branding and permissions
        run: python3 tool/prepare_platforms.py
      - name: Resolve packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Confirm APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QREX-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned compilation
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS project hosts
        run: flutter create --platforms=android,ios --org com.brendigo --project-name qrex .
      - name: Apply QREX native branding and permissions
        run: python3 tool/prepare_platforms.py
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze --fatal-infos
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
      - name: Check generated app
        run: test -d build/ios/iphoneos/Runner.app
